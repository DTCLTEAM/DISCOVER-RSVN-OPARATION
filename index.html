// ─── GLOBAL SEARCH ───────────────────────────────────────────
function GlobalSearch({bookings,suppliers,openBk,setPage,C}){
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const s=q.trim().toLowerCase();
  let results=[];
  if(s.length>=2){
    bookings.forEach(b=>{
      const hitFields=[];
      if(b.id?.toLowerCase().includes(s))hitFields.push("Booking ID");
      if(b.leadGuest?.toLowerCase().includes(s))hitFields.push("Guest");
      if(b.agentName?.toLowerCase().includes(s))hitFields.push("Agent");
      if(b.mobile?.replace(/\s/g,"").includes(s.replace(/\s/g,"")))hitFields.push("Mobile");
      if(b.voucher?.num?.toLowerCase().includes(s))hitFields.push("Voucher No");
      if(b.invoice?.num?.toLowerCase().includes(s))hitFields.push("Invoice No");
      (b.hotels||[]).forEach(h=>{
        if(h.hotelName?.toLowerCase().includes(s))hitFields.push(`Hotel: ${h.hotelName}`);
        if(h.confNum?.toLowerCase().includes(s))hitFields.push(`Hotel Conf#: ${h.confNum}`);
      });
      (b.services||[]).forEach(sv=>{
        if(sv.name?.toLowerCase().includes(s))hitFields.push(`Service: ${sv.name}`);
        if(sv.supplierRef?.toLowerCase().includes(s))hitFields.push(`Service Conf#: ${sv.supplierRef}`);
      });
      if(hitFields.length)results.push({type:"booking",id:b.id,title:b.id,sub:`${b.leadGuest} · ${b.arrival} · ${b.status}`,match:hitFields[0],b});
    });
    suppliers.forEach(sp=>{
      if([sp.name,sp.contact,sp.mobile,sp.email].some(v=>v?.toLowerCase().includes(s)))
        results.push({type:"supplier",id:sp.id,title:sp.name,sub:`${sp.category} · ${sp.destination}`,match:"Supplier"});
    });
  }
  results=results.slice(0,8);
  const go=r=>{
    setQ("");setOpen(false);
    if(r.type==="booking")openBk(r.id);
    else setPage("suppliers");
  };
  return(<div style={{position:"relative",flex:1,maxWidth:420}}>
    <input value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)}
      placeholder="🔍 Search booking ID, guest, conf#, invoice..."
      style={{width:"100%",background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box"}}
      onBlur={()=>setTimeout(()=>setOpen(false),200)}/>
    {open&&s.length>=2&&(<div style={{position:"absolute",top:"110%",left:0,right:0,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,boxShadow:"0 12px 40px #00000060",zIndex:500,overflow:"hidden",maxHeight:400,overflowY:"auto"}}>
      {results.length===0&&<div style={{padding:"16px",fontSize:13,color:C.sub,textAlign:"center"}}>No results for "{q}"</div>}

  </div>);
}

// ─── DASHBOARD ───────────────────────────────────────────────
function DashboardPage({bookings,allSvcs,today,openBk,setPage,setOpsDate,C}){
  const tmrw=new Date();tmrw.setDate(tmrw.getDate()+1);const tmrwStr=tmrw.toISOString().split("T")[0];
  const kpis=[
    {l:"New Confirmations",v:bookings.filter(b=>b.status==="New Confirmation").length,c:C.blue,i:"🆕"},
    {l:"Arrivals Today",v:bookings.filter(b=>b.arrival===today).length,c:C.green,i:"✈️"},
    {l:"Departures Today",v:bookings.filter(b=>b.departure===today).length,c:C.orange,i:"🛫"},
    {l:"Services Today",v:allSvcs.filter(s=>s.date===today).length,c:C.teal,i:"🔧"},
    {l:"Services Tomorrow",v:allSvcs.filter(s=>s.date===tmrwStr).length,c:C.purple,i:"📅"},
    {l:"Hotel Pending",v:bookings.flatMap(b=>b.hotels||[]).filter(h=>h.status==="Waiting for Confirmation").length,c:C.coral,i:"🏨"},
    {l:"Driver Not Assigned",v:allSvcs.filter(s=>["Airport Transfer","Intercity Transfer"].includes(s.category)&&!s.driver&&s.status!=="Completed").length,c:C.coral,i:"🚗"},
    {l:"Voucher Pending",v:bookings.filter(b=>["Not Prepared","Draft"].includes(b.voucher?.status)).length,c:C.amber,i:"📄"},
    {l:"Fully Confirmed",v:bookings.filter(b=>b.status==="Fully Confirmed").length,c:C.green,i:"✅"},
    {l:"Running",v:bookings.filter(b=>b.status==="Running").length,c:C.teal,i:"🏃"},
    {l:"Completed",v:bookings.filter(b=>b.status==="Completed").length,c:C.sub,i:"🏁"},
    {l:"Total Bookings",v:bookings.length,c:C.gold,i:"📒"},
  ];
  const warns=[];
  allSvcs.forEach(s=>{
    if(!s.supplier&&s.status!=="Completed")warns.push(`No supplier: ${s.name} (${s.bookingId})`);
    if(["Airport Transfer","Intercity Transfer"].includes(s.category)&&!s.driver&&s.status!=="Completed")warns.push(`Driver needed: ${s.name} (${s.bookingId})`);
    if(s.date===today&&s.status==="Pending")warns.push(`Due today & still Pending: ${s.name} (${s.bookingId})`);
  });
  bookings.forEach(b=>{
    (b.hotels||[]).forEach(h=>{if(h.status==="Waiting for Confirmation")warns.push(`Hotel conf. pending: ${h.hotelName} — ${b.id}`);});
    if(!b.mobile)warns.push(`Guest contact missing: ${b.leadGuest} (${b.id})`);
    const d2a=Math.ceil((new Date(b.arrival)-new Date())/(1000*60*60*24));
    const invStat=b.invoice?.status||b.paymentStatus;
    if(d2a>=0&&d2a<=14&&!["Paid"].includes(invStat)&&b.status!=="Cancelled")warns.push(`💰 PAYMENT FOLLOW-UP: ${b.leadGuest} (${b.id}) arrives in ${d2a} day(s) — payment status: ${invStat}`);
  });
  const todaySvcs=allSvcs.filter(s=>s.date===today);

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:24}}>
        <div><SecTitle C={C}>📊 Operations Dashboard</SecTitle>
          <div style={{fontSize:13,color:C.sub}}>{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</div>
        </div>
        <Btn onClick={()=>{setOpsDate(today);setPage("operations");}} C={C}>🗓 Today's Operations Board</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:12,marginBottom:28}}>
        {kpis.map(k=>(<Card key={k.l} C={C} style={{cursor:"pointer",padding:18}} onClick={()=>setPage("bookings")}>
          <div style={{fontSize:26,marginBottom:10}}>{k.i}</div>
          <div style={{fontSize:30,fontWeight:800,color:k.c,lineHeight:1,fontVariantNumeric:"tabular-nums"}}>{k.v}</div>
          <div style={{fontSize:11,color:C.sub,marginTop:6,fontWeight:600,lineHeight:1.3}}>{k.l}</div>
        </Card>))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:20}}>
        <Card C={C}><div style={{fontWeight:800,color:C.coral,marginBottom:14,fontSize:14}}>⚠️ Pending Actions ({warns.length})</div>
          {warns.length===0?<div style={{color:C.sub,fontSize:13}}>✅ All clear!</div>:warns.slice(0,8).map((w,i)=><Warn key={i} msg={w} C={C}/>)}
        </Card>
        <Card C={C}><div style={{fontWeight:800,color:C.gold,marginBottom:14,fontSize:14}}>📒 Recent Bookings</div>
          {bookings.slice().reverse().slice(0,5).map(b=>(<div key={b.id} onClick={()=>openBk(b.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:`1px solid ${C.border}55`,cursor:"pointer",gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:13,color:C.blue}}>{b.id}</div>
              <div style={{fontSize:12,color:C.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.leadGuest} · {b.adults} pax · {b.destination}</div>
            </div><Badge text={b.status} C={C}/>
          </div>))}
        </Card>
        {todaySvcs.length>0&&(<Card C={C} style={{gridColumn:"1/-1"}}>
          <div style={{fontWeight:800,color:C.teal,marginBottom:14,fontSize:14}}>🔧 Today's Services ({todaySvcs.length})</div>
          <DataTable C={C} headers={["Time","Booking","Guest","Service","Status"]} empty="None today"
            rows={todaySvcs.map(s=>[<span style={{fontWeight:700,color:C.gold}}>{s.time||"—"}</span>,<span style={{color:C.blue}}>{s.bookingId}</span>,s.leadGuest,<span style={{fontWeight:600}}>{s.name}</span>,<Badge text={s.status} C={C}/>])}/>
        </Card>)}
      </div>
    </div>
  );
}

        <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",margin:"14px 0 6px"}}>Send Invoice To Agent / Guest</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn size="sm" variant="green" onClick={()=>{markSent();openLink(`https://wa.me/${(booking.whatsapp||booking.mobile||"").replace(/[^0-9]/g,"")}?text=${encodeURIComponent(invText)}`);}} C={C}>💬 WhatsApp</Btn>
          <Btn size="sm" variant="blue" onClick={()=>{markSent();openLink(`mailto:?subject=${encodeURIComponent(`Invoice ${meta.num} – ${booking.id} – Discover Thailand`)}&body=${encodeURIComponent(invText)}`);}} C={C}>✉️ Email</Btn>
        </div>
        {msg&&<div style={{fontSize:12,color:C.green,marginTop:10,fontWeight:600}}>{msg}</div>}
        {meta.sentDate&&<div style={{fontSize:11,color:C.sub,marginTop:8}}>📤 Last sent: {meta.sentDate}</div>}
      </Card>
      <Card C={C}>
        <div style={{fontWeight:700,color:C.gold,marginBottom:12}}>Preview</div>
        <div style={{marginBottom:10}}><Badge text={meta.status} size="lg" C={C}/></div>
        <pre style={{fontSize:11,color:C.text,whiteSpace:"pre-wrap",lineHeight:1.8,fontFamily:"monospace",background:C.bg,borderRadius:9,padding:14,maxHeight:420,overflow:"auto"}}>{invText}</pre>
      </Card>
    </div>
  </div>);
}

// ─── OPERATIONS PAGE ─────────────────────────────────────────
function OpsPage({allSvcs,opsDate,setOpsDate,updateBk,today,C}){
  const [search,setSearch]=useState("");const [catF,setCatF]=useState("");const [statF,setStatF]=useState("");
  const services=allSvcs.filter(s=>s.date===opsDate&&(!search||[s.name,s.bookingId,s.leadGuest].some(v=>v?.toLowerCase().includes(search.toLowerCase())))&&(!catF||s.category===catF)&&(!statF||s.status===statF)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const updStat=(bkId,sid,status)=>updateBk(bkId,b=>({...b,services:b.services.map(s=>s.id===sid?{...s,status}:s)}));
  const warns=allSvcs.filter(s=>s.date===opsDate).flatMap(s=>{const w=[];if(!s.supplier&&s.status!=="Completed")w.push(`No supplier: ${s.name}`);if(["Airport Transfer","Intercity Transfer"].includes(s.category)&&!s.driver&&s.status!=="Completed")w.push(`Driver needed: ${s.name}`);if(!s.time)w.push(`Time missing: ${s.name}`);return w;});
  const setDay=offset=>{const d=new Date();d.setDate(d.getDate()+offset);setOpsDate(d.toISOString().split("T")[0]);};
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <SecTitle C={C}>🗓 Daily Operations Board</SecTitle>
      <div style={{display:"flex",gap:8}}><Btn variant="ghost" size="sm" onClick={()=>setDay(-1)} C={C}>← Prev</Btn><Btn variant="ghost" size="sm" onClick={()=>setOpsDate(today)} C={C}>Today</Btn><Btn variant="ghost" size="sm" onClick={()=>setDay(1)} C={C}>Next →</Btn></div>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
      <input type="date" value={opsDate} onChange={e=>setOpsDate(e.target.value)} style={{background:C.card,border:`1px solid ${C.teal}60`,color:C.gold,borderRadius:10,padding:"10px 14px",fontFamily:"inherit",fontSize:14,fontWeight:700,outline:"none"}}/>
      <SearchInp value={search} onChange={setSearch} C={C}/>
      <QSel value={catF} onChange={setCatF} C={C}><option value="">All Categories</option>{SERVICE_CATS.map(c=><option key={c}>{c}</option>)}</QSel>
      <QSel value={statF} onChange={setStatF} C={C}><option value="">All Statuses</option>{SERVICE_STATUSES.map(s=><option key={s}>{s}</option>)}</QSel>
    </div>
    {warns.length>0&&(<Card C={C} style={{marginBottom:16,borderColor:C.coral+"44"}}><div style={{fontWeight:700,color:C.coral,marginBottom:10}}>⚠️ Warnings ({warns.length})</div>{warns.map((w,i)=><Warn key={i} msg={w} C={C}/>)}</Card>)}
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
      {[["Total",services.length,C.gold],["Confirmed",services.filter(s=>["Confirmed","Ready"].includes(s.status)).length,C.green],["Pending",services.filter(s=>s.status==="Pending").length,C.orange],["Completed",services.filter(s=>s.status==="Completed").length,C.sub]].map(([l,v,col])=>(<div key={l} style={{background:col+"20",border:`1px solid ${col}40`,borderRadius:20,padding:"5px 14px",fontSize:12,color:col,fontWeight:700}}>{l}: {v}</div>))}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
      {services.map(s=>(<Card key={s.id} C={C} style={{padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:10}}>
          <div><div style={{fontWeight:800,color:C.gold,fontSize:17}}>{s.time||"—"}</div><div style={{fontWeight:700,fontSize:13,marginTop:2}}>{s.name}</div><div style={{fontSize:11,color:C.blue,marginTop:1}}>{s.bookingId} · {s.leadGuest}</div></div>
          <Badge text={s.status} C={C}/>
        </div>
        <div style={{fontSize:12,color:C.sub,marginBottom:8}}>{s.category}{s.pickup&&` · ${s.pickup}`}</div>
        {s.supplier&&<div style={{fontSize:12,color:C.teal,marginBottom:4}}>🏢 {s.supplier}{s.vehicle&&` · ${s.vehicle}`}</div>}
        {s.driver&&<div style={{fontSize:12,color:C.blue,marginBottom:4}}>🚗 {s.driver}</div>}
        {s.guide&&<div style={{fontSize:12,color:C.purple,marginBottom:4}}>🧑‍🦯 {s.guide}</div>}
        {!s.driver&&!s.guide&&<div style={{fontSize:11,color:C.coral,marginBottom:4}}>⚠ No driver / guide assigned</div>}
        <Divider C={C}/>
        <Sel label="" value={s.status} onChange={v=>updStat(s.bookingId,s.id,v)} options={SERVICE_STATUSES} C={C} fullWidth/>
      </Card>))}
      {services.length===0&&(<div style={{gridColumn:"1/-1",textAlign:"center",padding:60,color:C.sub}}><div style={{fontSize:48,marginBottom:16}}>📅</div><div style={{fontSize:16,fontWeight:600}}>No services for {opsDate}</div></div>)}
    </div>
  </div>);
}

// ─── VOUCHERS PAGE ───────────────────────────────────────────
function VouchersPage({bookings,updateBk,C}){
  return(<div><SecTitle C={C}>📄 Vouchers</SecTitle>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
      {bookings.map(b=>(<Card key={b.id} C={C}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><div style={{fontWeight:700,color:C.gold,fontSize:13}}>{b.voucher?.num||"—"}</div><Badge text={b.voucher?.status||"Not Prepared"} C={C}/></div>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{b.leadGuest}</div>
        <div style={{fontSize:12,color:C.sub,marginBottom:4}}>{b.id} · {b.agentName}</div>
        <div style={{fontSize:12,color:C.sub,marginBottom:12}}>{b.arrival} → {b.departure} · {(b.services||[]).length} services</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn size="sm" variant="green" onClick={()=>updateBk(b.id,{voucher:{...b.voucher,status:"Ready"}})} C={C}>✅ Ready</Btn>
          <Btn size="sm" variant="blue" onClick={()=>updateBk(b.id,{voucher:{...b.voucher,status:"Sent to Customer"}})} C={C}>📤 Sent</Btn>
        </div>
      </Card>))}
    </div>
  </div>);
}

// ─── SUPPLIERS PAGE ──────────────────────────────────────────
function SuppliersPage({suppliers,setSuppliers,C}){
  const [search,setSearch]=useState("");const [catF,setCatF]=useState("");const [show,setShow]=useState(false);
  const [editId,setEditId]=useState(null);
  const es={name:"",category:"Tour",destination:"",contact:"",mobile:"",whatsapp:"",lineId:"",email:"",ccEmail:"",notes:"",status:"Active"};
  const [form,setForm]=useState(es);const sf=k=>v=>setForm(f=>({...f,[k]:v}));
  const filtered=suppliers.filter(s=>(!search||[s.name,s.contact].some(v=>v?.toLowerCase().includes(search.toLowerCase())))&&(!catF||s.category===catF));
  const openAdd=()=>{setEditId(null);setForm(es);setShow(true);};
  const openEdit=s=>{setEditId(s.id);setForm({...es,...s});setShow(true);};
  const save=()=>{
    if(editId){setSuppliers(ss=>ss.map(s=>s.id===editId?{...s,...form,id:editId}:s));}
    else{setSuppliers(ss=>[...ss,{...form,id:`SUP${String(ss.length+1).padStart(3,"0")}`}]);}
    setShow(false);setForm(es);setEditId(null);
  };
  const del=id=>{if(confirm("Delete supplier?"))setSuppliers(ss=>ss.filter(s=>s.id!==id));};
  const waLink=n=>`https://wa.me/${(n||"").replace(/[^0-9]/g,"")}`;
  const lineLink=id=>`https://line.me/ti/p/~${encodeURIComponent(id||"")}`;
  const mailLink=s=>`mailto:${s.email||""}${s.ccEmail?`?cc=${s.ccEmail}`:""}`;
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}><SecTitle C={C}>🏢 Suppliers</SecTitle><Btn onClick={openAdd} C={C}>+ Add Supplier</Btn></div>
    <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}><SearchInp value={search} onChange={setSearch} placeholder="🔍 Search suppliers..." C={C}/><QSel value={catF} onChange={setCatF} C={C}><option value="">All Categories</option>{SERVICE_CATS.map(c=><option key={c}>{c}</option>)}</QSel></div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
      {filtered.map(s=>(<Card key={s.id} C={C}><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><div style={{fontWeight:800,fontSize:15}}>{s.name}</div><Badge text={s.status} C={C}/></div>
        <div style={{fontSize:12,color:C.teal,marginBottom:8,fontWeight:600}}>{s.category} · {s.destination}</div>
        {s.contact&&<div style={{fontSize:13,color:C.sub,marginBottom:4}}>👤 {s.contact}</div>}
        {s.mobile&&<div style={{fontSize:13,color:C.sub,marginBottom:4}}>📞 {s.mobile}</div>}
        {s.whatsapp&&s.whatsapp!==s.mobile&&<div style={{fontSize:13,color:C.sub,marginBottom:4}}>💬 {s.whatsapp}</div>}
        {s.lineId&&<div style={{fontSize:13,color:C.sub,marginBottom:4}}>🟢 Line: {s.lineId}</div>}
        {s.email&&<div style={{fontSize:13,color:C.sub,marginBottom:4}}>✉️ {s.email}</div>}
        {s.ccEmail&&<div style={{fontSize:12,color:C.muted,marginBottom:8}}>📧 CC: {s.ccEmail}</div>}
        {s.notes&&<div style={{fontSize:11,color:C.muted,fontStyle:"italic",marginBottom:10}}>{s.notes}</div>}
        {/* Send booking channels */}
        <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",margin:"10px 0 6px"}}>Send Booking Via</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
          {(s.whatsapp||s.mobile)&&<Btn size="sm" variant="green" onClick={()=>openLink(waLink(s.whatsapp||s.mobile))} C={C}>💬 WhatsApp</Btn>}
          {s.lineId&&<Btn size="sm" variant="green" onClick={()=>openLink(lineLink(s.lineId))} C={C}>🟢 Line</Btn>}
          {s.email&&<Btn size="sm" variant="blue" onClick={()=>openLink(mailLink(s))} C={C}>✉️ Email</Btn>}
          {!s.whatsapp&&!s.mobile&&!s.lineId&&!s.email&&<span style={{fontSize:11,color:C.coral}}>⚠ No contact channels added</span>}
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn size="sm" variant="blue" onClick={()=>openEdit(s)} C={C}>✏️ Edit</Btn>
          <Btn size="sm" variant="danger" onClick={()=>del(s.id)} C={C}>Delete</Btn>
        </div>
      </Card>))}
    </div>
    {show&&(<Mdl title={editId?"✏️ Edit Supplier":"🏢 Add Supplier"} onClose={()=>{setShow(false);setEditId(null);}} C={C}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"0 16px"}}>
        <Inp label="Name" value={form.name} onChange={sf("name")} C={C}/><Inp label="Category" value={form.category} onChange={sf("category")} options={SERVICE_CATS} C={C}/>
        <Inp label="Destination" value={form.destination} onChange={sf("destination")} C={C}/><Inp label="Contact Person" value={form.contact} onChange={sf("contact")} C={C}/>
        <Inp label="Mobile" value={form.mobile} onChange={sf("mobile")} C={C}/><Inp label="WhatsApp" value={form.whatsapp} onChange={sf("whatsapp")} placeholder="+66 81 234 5678" C={C}/>
        <Inp label="Line ID" value={form.lineId} onChange={sf("lineId")} placeholder="e.g. cruisebkk" C={C}/><Inp label="Main Email" value={form.email} onChange={sf("email")} placeholder="reservations@hotel.com" C={C}/>
        <Inp label="CC Email" value={form.ccEmail} onChange={sf("ccEmail")} placeholder="manager@hotel.com" C={C}/><Inp label="Status" value={form.status} onChange={sf("status")} options={["Active","Inactive"]} C={C}/>
      </div>
      <Txa label="Notes" value={form.notes} onChange={sf("notes")} C={C}/>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}><Btn variant="ghost" onClick={()=>{setShow(false);setEditId(null);}} C={C}>Cancel</Btn><Btn onClick={save} C={C}>{editId?"💾 Save Changes":"✅ Add Supplier"}</Btn></div>
    </Mdl>)}
  </div>);
}

// ─── REPORTS PAGE ────────────────────────────────────────────
function ReportsPage({bookings,allSvcs,today,openBk,C}){
  const [active,setActive]=useState("all");
  const pendingHotels=bookings.flatMap(b=>(b.hotels||[]).filter(h=>["Waiting for Confirmation","Sent to Hotel","Email Prepared","Not Sent","Amendment Sent"].includes(h.status)).map(h=>({...h,bookingId:b.id,leadGuest:b.leadGuest,arrival:b.arrival})));
  const pendingSvcs=allSvcs.filter(s=>["Pending","Request Sent","Waiting for Supplier"].includes(s.status));
  const unpaid=bookings.filter(b=>{const st=b.invoice?.status||b.paymentStatus;return!["Paid"].includes(st)&&b.status!=="Cancelled";});
  const rpts={
    all:{l:"All Bookings",count:bookings.length},
    arrivals:{l:"By Arrival Date",count:bookings.length},
    hotelPending:{l:"Hotel Pending",count:pendingHotels.length},
    svcPending:{l:"Service Pending",count:pendingSvcs.length},
    unpaid:{l:"Payment Due",count:unpaid.length},
    running:{l:"Running",count:bookings.filter(b=>b.status==="Running").length},
    completed:{l:"Completed",count:bookings.filter(b=>b.status==="Completed").length},
    cancelled:{l:"Cancelled",count:bookings.filter(b=>b.status==="Cancelled").length},
  };
  const exportCSV=()=>{const rows=[["ID","Guest","Agent","Arrival","Departure","Status","Payment"],...bookings.map(b=>[b.id,b.leadGuest,b.agentName,b.arrival,b.departure,b.status,b.invoice?.status||b.paymentStatus])];const blob=new Blob([rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`DT_Report_${today}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);};
  const stats=[["Total",bookings.length,C.gold,"all"],["Arrivals Today",bookings.filter(b=>b.arrival===today).length,C.green,"arrivals"],["Hotel Pending",pendingHotels.length,C.orange,"hotelPending"],["Service Pending",pendingSvcs.length,C.purple,"svcPending"],["Payment Due",unpaid.length,C.coral,"unpaid"],["Completed",bookings.filter(b=>b.status==="Completed").length,C.sub,"completed"]];
  const bkRows=list=>list.map(b=>[
    <span style={{color:C.blue,fontWeight:700}}>{b.id}</span>,
    <span style={{fontWeight:600}}>{b.leadGuest}</span>,
    <span style={{color:C.sub,fontSize:12}}>{b.agentName}</span>,
    <span style={{fontSize:12}}>{b.arrival}</span>,
    <span style={{fontSize:12}}>{b.departure}</span>,
    <Badge text={b.status} C={C}/>,
    <Badge text={b.invoice?.status||b.paymentStatus} C={C}/>,
    <Btn size="sm" variant="blue" onClick={()=>openBk(b.id)} C={C}>Open</Btn>
  ]);
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}><SecTitle C={C}>📈 Reports</SecTitle><Btn variant="blue" onClick={exportCSV} C={C}>⬇ Export CSV</Btn></div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12,marginBottom:24}}>
      {stats.map(([l,v,col,key])=>(<Card key={l} C={C} onClick={()=>setActive(key)} style={{textAlign:"center",padding:16,cursor:"pointer",border:`1px solid ${active===key?col:C.border}`,transition:"border .15s"}}><div style={{fontSize:28,fontWeight:800,color:col,lineHeight:1}}>{v}</div><div style={{fontSize:11,color:C.sub,marginTop:6,fontWeight:600}}>{l}</div><div style={{fontSize:9,color:active===key?col:C.muted,marginTop:4,fontWeight:700}}>{active===key?"● VIEWING":"TAP TO VIEW"}</div></Card>))}
    </div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
      {Object.entries(rpts).map(([key,r])=>(<button key={key} onClick={()=>setActive(key)} style={{background:active===key?C.teal+"22":C.card,border:`1px solid ${active===key?C.teal:C.border}`,color:active===key?C.teal:C.sub,borderRadius:9,padding:"8px 16px",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,transition:"all .15s"}}>{r.l} ({r.count})</button>))}
    </div>
    {active==="hotelPending"&&(
      <DataTable C={C} headers={["Booking","Guest","Hotel","Check-in","Rooms","Status","Action"]} empty="✅ No pending hotel confirmations — all hotels confirmed!"
        rows={pendingHotels.map(h=>[
          <span style={{color:C.blue,fontWeight:700}}>{h.bookingId}</span>,
          <span>{h.leadGuest}</span>,
          <span style={{fontWeight:600}}>{h.hotelName}</span>,
          <span style={{fontSize:12}}>{h.checkin}</span>,
          <span style={{fontSize:12}}>{h.rooms} × {h.roomType}</span>,
          <Badge text={h.status} C={C}/>,
          <Btn size="sm" variant="blue" onClick={()=>openBk(h.bookingId)} C={C}>Open</Btn>
        ])}/>
    )}
    {active==="svcPending"&&(
      <DataTable C={C} headers={["Booking","Guest","Service","Date","Supplier","Status","Action"]} empty="✅ No pending services!"
        rows={pendingSvcs.map(s=>[
          <span style={{color:C.blue,fontWeight:700}}>{s.bookingId}</span>,
          <span>{s.leadGuest}</span>,
          <span style={{fontWeight:600}}>{s.name}</span>,
          <span style={{fontSize:12}}>{s.date} {s.time||""}</span>,
          <span style={{fontSize:12,color:s.supplier?C.teal:C.coral}}>{s.supplier||"⚠ Not assigned"}</span>,
          <Badge text={s.status} C={C}/>,
          <Btn size="sm" variant="blue" onClick={()=>openBk(s.bookingId)} C={C}>Open</Btn>
        ])}/>
    )}
    {active==="unpaid"&&(
      <DataTable C={C} headers={["Booking","Guest","Agent","Arrival","Balance","Payment Status","Action"]} empty="✅ All payments received!"
        rows={unpaid.map(b=>{
          const d2a=Math.ceil((new Date(b.arrival)-new Date())/(1000*60*60*24));
          return[
            <span style={{color:C.blue,fontWeight:700}}>{b.id}</span>,
            <span>{b.leadGuest}</span>,
            <span style={{color:C.sub,fontSize:12}}>{b.agentName}</span>,
            <span style={{fontSize:12,color:d2a>=0&&d2a<=14?C.coral:C.text,fontWeight:d2a>=0&&d2a<=14?700:400}}>{b.arrival}{d2a>=0&&d2a<=14?` (${d2a}d!)`:""}</span>,
            <span style={{color:C.coral,fontWeight:700}}>{b.invoice?.balance!=null?`${Number(b.invoice.balance).toLocaleString()} ${b.invoice.currency||"THB"}`:"—"}</span>,
            <Badge text={b.invoice?.status||b.paymentStatus} C={C}/>,
            <Btn size="sm" variant="blue" onClick={()=>openBk(b.id)} C={C}>Open</Btn>
          ];
        })}/>
    )}
    {(active==="all"||active==="arrivals"||active==="running"||active==="completed"||active==="cancelled")&&(
      <DataTable C={C} headers={["Booking ID","Guest","Agent","Arrival","Departure","Status","Payment","Action"]} empty="No records"
        rows={bkRows(
          active==="all"?bookings:
          active==="arrivals"?[...bookings].sort((a,b)=>a.arrival.localeCompare(b.arrival)):
          active==="running"?bookings.filter(b=>b.status==="Running"):
          active==="completed"?bookings.filter(b=>b.status==="Completed"):
          bookings.filter(b=>b.status==="Cancelled")
        )}/>
    )}
  </div>);
}

root.render(<App/>);

</script>
