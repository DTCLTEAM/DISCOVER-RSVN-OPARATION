const TERMS_GENERAL={items:["Rates & Confirmation — All rates are subject to availability and are guaranteed only after written confirmation from Discover Thailand Co., Ltd.","Payment — Full payment must be received within the stated payment deadline. Failure to pay on time may result in automatic cancellation of the booking.","Cancellation / No-Show — Cancellation charges apply according to the confirmed booking policy. No-show or last-minute cancellation may incur a 100% charge.","Non-Refundable Services — All unused or partially used services are non-refundable and non-transferable.","Hotel Rooms — Confirmed rooms are guaranteed for the scheduled arrival date only. In case of no-show, rooms may be released with a 100% penalty.","Itinerary Changes — Tour timings, routing, or sequence may change due to weather, traffic, operational conditions, government regulations, or circumstances beyond our control. Confirmed inclusions will remain unchanged wherever reasonably possible.","Flight Details & Transfers — Correct flight details must be provided in advance. Any flight change or delay should be reported immediately. Additional transfer or waiting charges may apply.","Waiting & Pick-up Time — Guests must be ready at the confirmed pick-up time. Missed services due to guest delays are non-refundable, and replacement transportation will be charged separately.","Hotel Check-in / Check-out — Early check-in, late check-out, room upgrades, extra beds, and special room requests are subject to hotel availability and may incur additional charges.","Joiner / Visitor Policy — Joiner or visitor policies and applicable charges are determined directly by each hotel. Guests should verify these with the hotel.","Peak Dates & Surcharges — Compulsory dinners, seasonal supplements, holiday surcharges, and special-event charges may apply where applicable.","Passport, Visa & Immigration — Guests are responsible for valid passports, visas, entry requirements, and immigration compliance. Discover Thailand Co., Ltd. cannot guarantee visa approval or entry permission.","Personal & Additional Expenses — Any service or expense not specifically mentioned under Package Inclusions is payable by the guest.","Force Majeure — Discover Thailand Co., Ltd. shall not be responsible for delays, cancellations, or additional expenses caused by events beyond reasonable control, including severe weather, natural disasters, government actions, strikes, or transportation disruptions.","Booking Acceptance — Confirmation and/or payment of the booking constitutes acceptance of the applicable rates, inclusions, cancellation policy, and these Terms & Conditions."],important:"Please check all passenger names, travel dates, flight details, hotel details, room categories, and services carefully before confirmation. Any amendment after confirmation is subject to availability and may incur additional charges."};
