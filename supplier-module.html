<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover Thailand — Supplier & Contract Rates</title>
<style>
:root{--teal:#0f8f7a;--teal2:#0b6f5f;--ink:#1d2a3a;--mut:#5f6b7a;--line:#dfe6e0;--soft:#f3f8f6;--cream:#fbfaf5;--amb:#9a5b00;--red:#b42318;--green:#178a4c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans","Noto Sans Thai","Noto Sans Bengali",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;color:var(--ink);background:#fff;line-height:1.45}
a{color:var(--teal2);cursor:pointer}
h1{font-size:22px;margin:0 0 10px;color:var(--amb)}h2{font-size:16px;margin:22px 0 8px;color:var(--teal2);text-transform:uppercase;letter-spacing:.8px}h3{font-size:15px;margin:16px 0 6px;color:var(--teal2)}h4{font-size:13px;margin:14px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.top .logo{height:36px}.brand{font-weight:800;color:var(--teal2);flex:1;font-size:15px}.role{font-size:12px;color:var(--mut);background:var(--soft);border-radius:14px;padding:3px 9px;white-space:nowrap}
.burger{display:none;background:none;border:0;font-size:22px;color:var(--ink)}
.proto{background:#fff3c4;color:#6b4e00;font-size:12px;text-align:center;padding:4px 8px}
.nav{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--soft);overflow-x:auto}
.nav a{padding:7px 12px;border-radius:8px;font-weight:700;color:var(--mut);white-space:nowrap;text-decoration:none}.nav a.on{background:var(--teal);color:#fff}.pill{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px}
.main{padding:14px;max-width:1180px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--ink);cursor:pointer;font-size:14px;font-family:inherit}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}.btn.danger{border-color:#f0b4ad;color:var(--red);background:#fff5f4}
.lnk{background:none;border:0;color:var(--teal2);cursor:pointer;font-size:12px;font-family:inherit;text-decoration:underline;padding:0 4px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.filters,.sform{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sform label{flex:1 1 160px;min-width:140px}.sform .btn{align-self:end;height:42px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream);color:var(--ink)}textarea{min-height:64px}input[type=checkbox]{width:auto}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin:8px 0 2px}label input,label select,label textarea{margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
label.inline{display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;font-weight:600}label.inline input{width:auto;margin:0}
fieldset{border:1.5px solid var(--line);border-radius:10px;padding:6px 12px 10px;margin:10px 0}legend{font-size:12px;font-weight:700;color:var(--teal2);padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);margin:0;cursor:pointer}.chip input{width:auto;margin:0}.chip:has(input:checked){background:var(--teal);border-color:var(--teal);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.tile{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-decoration:none}.tile b{display:block;font-size:24px;color:var(--teal2)}.tile span{font-size:12px;color:var(--mut);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:8px}.card{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:inherit;text-decoration:none;display:block;cursor:default}a.card{cursor:pointer}a.card:hover{border-color:var(--teal)}.card.off{opacity:.72;background:#fafafa}.card.offer,.card.offer{grid-column:1/-1}.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.ch b{font-size:16px}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;background:#e5f3ef;color:var(--teal2);white-space:nowrap}.st-OnHold,.st-warn,.st-Pending{background:#fff0d6;color:var(--amb)}.st-Archived,.st-Superseded,.st-Rejected{background:#eceff1;color:#60707a}.st-Approved,.st-Active,.st-Current{background:#e3f4ea;color:var(--green)}.st-Draft{background:#e8f0fe;color:#1a56b8}
.muted{color:var(--mut)}.small{font-size:12px}.warn-t{color:var(--amb);font-weight:700}.note{white-space:pre-wrap;background:var(--soft);padding:8px 10px;border-radius:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.kv div{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:14px}.kv small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin:10px 0 0}.tabs a{padding:9px 12px;font-weight:700;color:var(--mut);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;text-decoration:none}.tabs a.on{color:var(--teal2);border-color:var(--teal)}.tabbody{padding:12px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:6px;border-bottom:2px solid var(--line);background:var(--soft)}.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}.tbl input,.tbl select{padding:5px 7px;font-size:13px;border-radius:7px}
.plan{border-left:3px solid var(--teal);padding:6px 10px;margin:8px 0;background:#fafdfb;border-radius:0 8px 8px 0}
.list{margin:4px 0;padding-left:18px}.list li{margin-bottom:3px}
.box{background:var(--soft);border-left:4px solid var(--teal);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}.box.warn{background:#fff8e6;border-color:#e0a100}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:4px 0}
.price{background:#f1faf5;border-radius:8px;padding:6px 10px;margin:6px 0}.price b{font-size:17px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:4px}
.login{max-width:380px;margin:60px auto;padding:24px;border:1.5px solid var(--line);border-radius:16px;text-align:center}.login img{height:60px}.login h1{font-size:18px;color:var(--teal2)}.login label{text-align:left}.login .btn{margin-top:14px;width:100%;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}.mbox{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px;color:var(--amb)}.x{background:var(--soft);border:0;border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer}.mb{padding:10px 16px;overflow:auto}.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw}.toast.err{background:var(--red)}.toast.warn{background:var(--amb)}
code{background:var(--soft);padding:1px 4px;border-radius:4px;font-size:12px}pre{white-space:pre-wrap;background:var(--soft);padding:8px;border-radius:8px}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:16px}}
@media(max-width:700px){.burger{display:block}.nav{display:none;flex-direction:column}body.navopen .nav{display:flex}.grid2,.grid3{grid-template-columns:1fr}.brand{font-size:13px}.role{display:none}.tbl{display:block;overflow-x:auto}}
@media print{.top,.nav,.proto,.actions,.btn{display:none}}
</style></head><body><div id="app"></div>

/* ================= PRICING ENGINE (pure) ================= */
function priceVersion(v,plan,q,ctx){
  const r={versionId:v.id,planId:plan.id,eligible:true,reasons:[],notes:[],needsVerification:false,currency:plan.currency,unit:plan.unit,base:0,charges:[],total:null};
  const ex=m=>{r.eligible=false;r.reasons.push(m);};
  if(v.state!=='Approved')ex('Not approved ('+v.state+')');
  if(q.bookingDate&&((v.bookFrom&&q.bookingDate<v.bookFrom)||(v.bookTo&&q.bookingDate>v.bookTo)))ex(`Booking date ${q.bookingDate} outside booking window ${v.bookFrom||'…'} → ${v.bookTo||'…'}`);
  if(v.markets&&v.markets.length&&(!q.market||!v.markets.includes(q.market)))ex(`Market "${q.market||'none'}" not eligible (allowed: ${v.markets.join(', ')})`);
  const pax=(q.adults||0)+(q.childAges||[]).length;
  if(v.minPax&&pax<v.minPax)ex(`Minimum ${v.minPax} pax (requested ${pax})`);
  if(v.maxPax&&pax>v.maxPax)ex(`Maximum ${v.maxPax} pax (requested ${pax})`);
  if(['Group Negotiated','One-time Special'].includes(plan.rateType)){if(!v.bookingRef||v.bookingRef!==q.bookingRef)ex(`${plan.rateType} rate is scoped to booking ${v.bookingRef||'(none)'} — cannot be reused for ${q.bookingRef||'this booking'}`);}
  const nightly=plan.unit==='per room/night';
  const from=q.svcFrom,to=q.svcTo||q.svcFrom;
  const nights=nightly?Math.max(0,daysBetween(from,to)):1;
  if(nightly&&nights<1)ex('Stay must have at least one night (check-out is exclusive)');
  if(nightly&&v.minNights&&nights<v.minNights)ex(`Minimum stay ${v.minNights} nights (requested ${nights})`);
  const days=nightly?Array.from({length:nights},(_,i)=>addDays(from,i)):[from];
  // date coverage per night/day
  const covered=[];
  days.forEach(d=>{const ok=(!v.svcFrom||d>=v.svcFrom)&&(!v.svcTo||d<=v.svcTo)&&(!v.weekdays||!v.weekdays.length||v.weekdays.includes(WD[new Date(d+'T00:00:00Z').getUTCDay()]))&&!(v.blackouts||[]).some(b=>d>=b.from&&d<=b.to);covered.push(ok);});
  r.coveredDays=days.filter((d,i)=>covered[i]);r.uncoveredDays=days.filter((d,i)=>!covered[i]);
  if(ctx&&ctx.partial){/* caller will merge nights across versions */}else if(r.uncoveredDays.length)ex(`No rate for ${nightly?'night':'date'}${r.uncoveredDays.length>1?'s':''} ${r.uncoveredDays.join(', ')}`);
  // price lines
  const lines=v.lines||[];const line=band=>lines.find(l=>l.band===band);
  let unitAmount=0;const parts=[];
  const need=(l,label)=>{if(!l){ex(`No ${label} price line`);return 0;}if(l.foc){r.notes.push(`${label}: FOC — ${l.focCond||'conditions not recorded'}`);if(!l.focCond){r.needsVerification=true;}return 0;}if(l.amount==null){ex(`${label} price missing (Rate Required, not zero)`);return 0;}return l.amount;};
  if(nightly){const b=line('Base');const rooms=q.rooms||1;unitAmount+=need(b,'Room')*rooms;parts.push(`${rooms} room × ${money(b?b.amount:null,plan.currency)}`);
    const eb=q.extraBeds||0;if(eb){const l=line('Extra Bed');unitAmount+=need(l,'Extra bed')*eb;parts.push(`${eb} extra bed`);}}
  else if(plan.unit==='per person'){const a=line('Adult');unitAmount+=need(a,'Adult')*(q.adults||0);parts.push(`${q.adults||0} adult`);
    (q.childAges||[]).forEach(age=>{const bands=lines.filter(l=>l.band==='Child'&&age>=(l.ageFrom??0)&&age<=(l.ageTo??99));const inf=lines.filter(l=>l.band==='Infant'&&age>=(l.ageFrom??0)&&age<=(l.ageTo??99));const m=[...inf,...bands];if(!m.length)ex(`Child age ${age} matches no child/infant band (bands: ${lines.filter(l=>['Child','Infant'].includes(l.band)).map(l=>`${l.band} ${l.ageFrom??0}–${l.ageTo??99}`).join('; ')||'none'})`);else if(m.length>1)ex(`Child age ${age} matches overlapping bands — ambiguous`);else{unitAmount+=need(m[0],`${m[0].band} ${age}y`);parts.push(`child ${age}y`);}});}
  else{const b=line('Base');const qty=q.qty||1;unitAmount+=need(b,plan.unit)*qty;parts.push(`${qty} × ${plan.unit}`);}
  if(q.vehicleCapacity&&q.vehicleCapacity<pax)ex(`Vehicle seats ${q.vehicleCapacity} < ${pax} pax`);
  const mult=nightly?(ctx&&ctx.partial?r.coveredDays.length:nights):1;
  r.base=unitAmount*mult;r.parts=parts;r.nights=nightly?nights:null;
  // surcharges
  (v.surcharges||[]).forEach(s=>{if(!s.compulsory)return;const hit=days.some(d=>(!s.dateFrom||d>=s.dateFrom)&&(!s.dateTo||d<=s.dateTo));if(!hit)return;if(!s.unit||s.amount==null){r.needsVerification=true;r.charges.push({name:s.name,amount:null,note:'unit/amount missing'});return;}
    let amt=0;if(s.unit==='per person')amt=s.amount*pax;else if(s.unit==='per room/night')amt=s.amount*(q.rooms||1)*days.filter(d=>(!s.dateFrom||d>=s.dateFrom)&&(!s.dateTo||d<=s.dateTo)).length;else amt=s.amount;r.charges.push({name:s.name,amount:amt,note:s.unit});});
  // taxes
  let running=r.base+r.charges.reduce((a,c)=>a+(c.amount||0),0);
  (v.taxes||[]).forEach(t=>{if(t.included==null||t.pct==null){r.needsVerification=true;r.charges.push({name:t.name,amount:null,note:'treatment unknown'});return;}if(t.included){r.notes.push(`${t.name} ${t.pct}% already included`);return;}const base=t.base==='base'?r.base:running;const amt=Math.round(base*t.pct/100);r.charges.push({name:`${t.name} ${t.pct}%`,amount:amt,note:t.base==='base'?'on base':'on base + prior charges'});running+=amt;});
  r.total=r.needsVerification?null:running;
  return r;
}
function priceOffer(offer,q){
  const plans=S.plans.filter(p=>p.offerId===offer.id);const out=[];
  plans.forEach(plan=>{
    const appr=approvedVersions(plan.id);const others=S.versions.filter(v=>v.planId===plan.id&&v.state!=='Approved'&&v.state!=='Superseded');
    if(!appr.length){others.forEach(v=>out.push(Object.assign(priceVersion(v,plan,q),{plan,version:v})));return;}
    if(plan.unit==='per room/night'&&appr.length>1){ // seasonal split
      const parts=appr.map(v=>priceVersion(v,plan,q,{partial:true}));const nights=Math.max(0,daysBetween(q.svcFrom,q.svcTo||q.svcFrom));const days=Array.from({length:nights},(_,i)=>addDays(q.svcFrom,i));
      const cover={};days.forEach(d=>{cover[d]=parts.filter(p=>p.coveredDays.includes(d)&&p.reasons.filter(x=>!x.startsWith('No rate for')).length===0);});
      const merged={versionId:appr.map(v=>v.id).join('+'),planId:plan.id,plan,version:appr[0],versions:appr,eligible:true,reasons:[],notes:[],needsVerification:false,currency:plan.currency,unit:plan.unit,base:0,charges:[],total:null,nights,split:[]};
      days.forEach(d=>{const c=cover[d];if(!c.length)merged.reasons.push(`No approved rate covers night ${d}`);else if(c.length>1){const prec=c.map(p=>p.version&&p.version.precedence);merged.reasons.push(`Night ${d}: ${c.length} approved versions overlap — ambiguous, set precedence or fix validity`);}});
      parts.forEach(p=>{if(p.reasons.filter(x=>!x.startsWith('No rate for')).length)merged.reasons.push(...p.reasons.filter(x=>!x.startsWith('No rate for')));});
      if(merged.reasons.length){merged.eligible=false;}else{let base=0;days.forEach(d=>{const p=cover[d][0];const per=p.base/Math.max(1,p.coveredDays.length);base+=per;merged.split.push({day:d,version:p.versionId,amount:per});});merged.base=base;
        // charges/taxes from each part proportionally: reuse first version's tax rules (same plan)
        const v=appr[0];let running=base;const seen=new Set();const allSur=[];appr.forEach(av=>(av.surcharges||[]).forEach(s=>{const k=s.name+'|'+(s.dateFrom||'')+'|'+(s.dateTo||'');if(!seen.has(k)){seen.add(k);allSur.push(s);}}));allSur.filter(s=>s.compulsory).forEach(s=>{const hitDays=days.filter(d=>(!s.dateFrom||d>=s.dateFrom)&&(!s.dateTo||d<=s.dateTo));if(!hitDays.length)return;if(!s.unit||s.amount==null){merged.needsVerification=true;merged.charges.push({name:s.name,amount:null,note:'unit/amount missing'});return;}const pax=(q.adults||0)+(q.childAges||[]).length;let amt=s.unit==='per person'?s.amount*pax:s.unit==='per room/night'?s.amount*(q.rooms||1)*hitDays.length:s.amount;merged.charges.push({name:s.name,amount:amt,note:s.unit});running+=amt;});
        (v.taxes||[]).forEach(t=>{if(t.included==null||t.pct==null){merged.needsVerification=true;merged.charges.push({name:t.name,amount:null,note:'treatment unknown'});return;}if(t.included){merged.notes.push(`${t.name} ${t.pct}% included`);return;}const b=t.base==='base'?base:running;const amt=Math.round(b*t.pct/100);merged.charges.push({name:`${t.name} ${t.pct}%`,amount:amt});running+=amt;});
        merged.total=merged.needsVerification?null:running;merged.notes.push('Seasonal split across '+appr.length+' approved versions');}
      out.push(merged);
    }else appr.forEach(v=>out.push(Object.assign(priceVersion(v,plan,q),{plan,version:v})));
  });
  // promotions vs contracts never stack; group-only handled above. Overlap across plans with same scope:
  const elig=out.filter(r=>r.eligible);
  if(elig.length>1){const scopeKey=r=>r.plan.unit+'|'+(r.version.markets||[]).join(',');const groups={};elig.forEach(r=>{(groups[scopeKey(r)]=groups[scopeKey(r)]||[]).push(r);});
    Object.values(groups).forEach(g=>{if(g.length<2)return;const withPrec=g.filter(r=>r.plan.precedence!=null);if(withPrec.length===g.length){const best=g.slice().sort((a,b)=>a.plan.precedence-b.plan.precedence)[0];g.forEach(r=>{if(r!==best){r.eligible=false;r.reasons.push(`Superseded by "${best.plan.name}" (precedence ${best.plan.precedence} < ${r.plan.precedence})`);}});}
      else{g.forEach(r=>{r.eligible=false;r.reasons.push(`Conflicts with ${g.length-1} other approved rate(s) for the same scope and no precedence rule — ambiguous, review required`);});}});}
  // availability
  const av=latestAvail(offer.id,q.svcFrom,q.svcTo||q.svcFrom);
  out.forEach(r=>{r.availability=av?av.state:'Unknown';r.availChecked=av?av.checkedAt:null;r.availStale=av?daysBetween(av.checkedAt.slice(0,10),today())>S.settings.freshDays:true;if(av&&av.state==='Stop Sale'&&r.eligible){r.eligible=false;r.reasons.push(`Stop Sale ${av.dateFrom||''}–${av.dateTo||''} (${av.source||'source n/a'})`);}
    if(r.eligible&&r.total!=null&&q.toCurrency&&q.toCurrency!==r.currency){const fx=S.settings.fx[r.currency]||S.settings.fx[q.toCurrency];if(fx){const rate=r.currency==='THB'?1/fx.rate:fx.rate;r.converted={amount:Math.round(r.total*rate),currency:q.toCurrency,rate:fx.rate,date:fx.date};}else r.notes.push('No FX rate recorded — showing original currency only');}});
  return out;
}
function sellMarkup(cost,p){return Math.round(cost*(1+p/100));}
function sellMargin(cost,m){if(m>=100)throw new Error('margin must be < 100%');return Math.round(cost/(1-m/100));}

/* ---------- suppliers ---------- */
let supFilter={q:'',cat:'',status:''};
function suppliersView(){const list=S.suppliers.filter(s=>(!supFilter.status||s.status===supFilter.status)&&(!supFilter.cat||s.categories.includes(supFilter.cat))&&(!supFilter.q||(s.name+' '+s.code+' '+(s.city||'')+' '+S.contacts.filter(c=>c.supplierId===s.id).map(c=>c.name+c.phone).join(' ')).toLowerCase().includes(supFilter.q.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="hrow"><h1>Suppliers <span class="muted">(${list.length})</span></h1>${can.edit()?`<button class="btn pri" onclick="addSupplier()">+ Add Supplier</button>`:''}</div>
  <div class="filters"><input placeholder="Search name, code, contact, phone…" value="${h(supFilter.q)}" oninput="supFilter.q=this.value;render()"><select onchange="supFilter.cat=this.value;render()"><option value="">All categories</option>${CATS.map(c=>`<option ${supFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select><select onchange="supFilter.status=this.value;render()"><option value="">All status</option>${['Active','On Hold','Archived'].map(c=>`<option ${supFilter.status===c?'selected':''}>${c}</option>`).join('')}</select></div>
  ${list.length?`<div class="cards">${list.map(s=>{const pc=S.contacts.find(c=>c.supplierId===s.id&&c.primary&&c.active)||S.contacts.find(c=>c.supplierId===s.id);const n=S.offers.filter(o=>o.supplierId===s.id).length;const ap=S.plans.filter(p=>S.offers.some(o=>o.id===p.offerId&&o.supplierId===s.id)&&approvedVersions(p.id).length).length;
  return `<a class="card" onclick="go('supplier','${s.id}','overview')"><div class="ch"><b>${h(s.name)}</b><span class="st st-${s.status.replace(' ','')}">${h(s.status)}</span></div><div class="muted">${h(s.code)} · ${s.categories.map(h).join(', ')} · ${h(s.city||s.destinations[0]||'')}${s.hotelCategory?' · '+h(s.hotelCategory):''}</div>${pc?`<div>👤 ${h(pc.name)}${pc.dept?' ('+h(pc.dept)+')':''} · ${h(pc.phone||pc.whatsapp||pc.email||'')}</div>`:'<div class="warn-t">⚠ No contact recorded</div>'}<div class="muted">${n} offer${n!==1?'s':''} · ${ap} with approved rates${s.preferred?' · ★ Preferred':''}</div></a>`;}).join('')}</div>`:'<p class="muted">No suppliers match.</p>'}`;}

function addSupplier(){openModal('Add Supplier — quick form',`<p class="muted small">Only the essentials. Everything else is on the supplier page tabs.</p>
 <label>Supplier name *<input name="name" required></label>
 <label>Category *<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
 <label>Destination *<input name="dest" list="dests" required><datalist id="dests">${DESTS.map(d=>`<option value="${d}">`).join('')}</datalist></label>
 <label>Supplier type<select name="type"><option>Direct Provider</option><option>Agent</option><option>Reseller</option></select></label>
 <fieldset><legend>First contact (at least one phone or email) *</legend><label>Contact name<input name="cname"></label><label>Department<select name="cdept">${DEPTS.map(d=>`<option ${d==='Reservations'?'selected':''}>${d}</option>`).join('')}</select></label><label>Phone / mobile<input name="cphone" placeholder="+66 …"></label><label>WhatsApp<input name="cwa"></label><label>Email<input name="cemail" type="email"></label></fieldset>`,f=>{
  if(!f.name.trim())return 'Name is required';if(!f.dest.trim())return 'Destination is required';if(!f.cphone.trim()&&!f.cemail.trim()&&!f.cwa.trim())return 'Add at least one phone, WhatsApp or email';
  const sup={id:uid(),code:code('SUP'),name:f.name.trim(),legalName:'',type:f.type,categories:[f.cat],country:'Thailand',city:f.dest.trim(),destinations:[f.dest.trim()],address:'',mapsUrl:'',website:'',taxId:'',owner:S.session.user,preferred:false,status:'Active',lastVerified:today(),nextReview:addDays(today(),180),notes:'',hotelCategory:'',createdAt:nowIso()};
  const d=dupSuppliers({...sup,phone:f.cphone});if(d.length&&!confirm(`Possible duplicate of: ${d.map(x=>x.name+' ('+x.code+')').join(', ')}.\n\nSave anyway as a separate supplier?`))return 'Not saved — review the existing supplier';
  S.suppliers.push(sup);S.contacts.push({id:uid(),supplierId:sup.id,name:f.cname.trim()||'Main contact',position:'',dept:f.cdept,email:f.cemail.trim(),phone:f.cphone.trim(),whatsapp:f.cwa.trim(),line:'',preferred:f.cwa?'WhatsApp':f.cphone?'Phone':'Email',hours:'',emergency:false,active:true,verifiedAt:today(),primary:true});
  S.policies.push({id:uid(),supplierId:sup.id,payment:{mode:'Prepayment',creditDays:null,creditEvent:'Invoice date',depositPct:null,depositAmt:null,dueBasis:'',balanceDeadline:'',currencies:['THB']},cancellation:[],noShow:'',amendment:'',refund:'',unusedCredit:''});
  audit('supplier',sup.id,'create',null,sup);save();go('supplier',sup.id,'overview');});}

function supplierView(){const s=find(S.suppliers,route.id);if(!s)return '<p>Supplier not found.</p>';const tabs=[['overview','Overview'],['contacts','Contacts'],['services','Services & Rates'],['docs','Contracts & Documents'],['policies','Policies'],['accounts','Accounts'],['history','History']];const tab=route.tab||'overview';
  return `<div class="crumb"><a onclick="go('suppliers')">Suppliers</a> › ${h(s.name)}</div><div class="hrow"><h1>${h(s.name)} <span class="st st-${s.status.replace(' ','')}">${h(s.status)}</span>${s.preferred?' <span class="st">★ Preferred</span>':''}</h1><span class="muted">${h(s.code)}</span></div>
  <div class="tabs">${tabs.map(([k,l])=>`<a class="${tab===k?'on':''}" onclick="go('supplier','${s.id}','${k}')">${l}</a>`).join('')}</div><div class="tabbody">${({overview:supOverview,contacts:supContacts,services:supServices,docs:supDocs,policies:supPolicies,accounts:supAccounts,history:supHistory})[tab](s)}</div>`;}

function supOverview(s){const kv=(k,v)=>`<div><small>${k}</small>${v||'<span class="muted">—</span>'}</div>`;
  return `<div class="kv">${kv('Code',h(s.code))}${kv('Trading name',h(s.name))}${kv('Legal name',h(s.legalName))}${kv('Type',h(s.type))}${kv('Categories',s.categories.map(h).join(', '))}${kv('Destinations covered',s.destinations.map(h).join(', '))}${kv('City / area',h(s.city))}${kv('Country',h(s.country))}${kv('Address',h(s.address))}${kv('Maps',s.mapsUrl?`<a href="${h(s.mapsUrl)}" target="_blank" rel="noopener">open ↗</a>`:'')}${kv('Website',s.website?`<a href="${h(s.website)}" target="_blank" rel="noopener">${h(s.website)}</a>`:'')}${kv('Company / Tax ID',h(s.taxId))}${s.categories.includes('Hotel')?kv('Hotel category (as recorded)',h(s.hotelCategory)):''}${kv('Account owner',h(s.owner))}${kv('Last verified',fd(s.lastVerified))}${kv('Next review',fd(s.nextReview))}</div>
  ${s.notes?`<h3>Internal notes</h3><p class="note">${h(s.notes)}</p>`:''}${s.legacy?`<details><summary class="muted">Legacy fields imported from Operations Hub</summary><pre class="small">${h(JSON.stringify(s.legacy,null,1))}</pre></details>`:''}
  ${can.edit()?`<div class="actions"><button class="btn" onclick="editSupplier('${s.id}')">✏ Edit details</button>${s.status!=='Archived'?`<button class="btn" onclick="setStatus('${s.id}','On Hold')">Put on hold</button><button class="btn danger" onclick="setStatus('${s.id}','Archived')">Archive</button>`:`<button class="btn" onclick="setStatus('${s.id}','Active')">Re-activate</button>`}</div>`:''}`;}
function setStatus(id,st){const s=find(S.suppliers,id);const reason=st==='Archived'?prompt('Reason for archiving (kept in audit):'):'';if(st==='Archived'&&reason===null)return;audit('supplier',id,'status',{status:s.status},{status:st},reason);s.status=st;save();render();}
function editSupplier(id){const s=find(S.suppliers,id);openModal('Edit supplier',`<label>Trading name *<input name="name" value="${h(s.name)}"></label><label>Legal name<input name="legalName" value="${h(s.legalName)}"></label><label>Type<select name="type">${['Direct Provider','Agent','Reseller'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
  <label>Categories</label><div class="chips">${CATS.map(c=>`<label class="chip"><input type="checkbox" name="cat_${c}" ${s.categories.includes(c)?'checked':''}>${c}</label>`).join('')}</div><label>Custom category<input name="customCat" placeholder="optional"></label>
  <label>Destinations covered (comma separated)<input name="dests" value="${h(s.destinations.join(', '))}"></label><label>City / area<input name="city" value="${h(s.city)}"></label><label>Country<input name="country" value="${h(s.country)}"></label><label>Address<textarea name="address">${h(s.address)}</textarea></label><label>Google Maps URL<input name="mapsUrl" value="${h(s.mapsUrl)}"></label><label>Website<input name="website" value="${h(s.website)}"></label><label>Company / Tax ID<input name="taxId" value="${h(s.taxId)}"></label><label>Hotel category (as recorded)<input name="hotelCategory" value="${h(s.hotelCategory)}" placeholder="e.g. 4 Star"></label><label>Internal account owner<input name="owner" value="${h(s.owner)}"></label><label class="inline"><input type="checkbox" name="preferred" ${s.preferred?'checked':''}> Preferred supplier</label><label>Last verified<input type="date" name="lastVerified" value="${s.lastVerified||''}"></label><label>Next review<input type="date" name="nextReview" value="${s.nextReview||''}"></label><label>Internal notes<textarea name="notes">${h(s.notes)}</textarea></label>`,f=>{
  if(!f.name.trim())return 'Name required';const before={...s};const cats=CATS.filter(c=>f['cat_'+c]);if(f.customCat.trim())cats.push(f.customCat.trim());if(!cats.length)return 'Select at least one category';
  Object.assign(s,{name:f.name.trim(),legalName:f.legalName,type:f.type,categories:cats,destinations:f.dests.split(',').map(x=>x.trim()).filter(Boolean),city:f.city,country:f.country,address:f.address,mapsUrl:f.mapsUrl,website:f.website,taxId:f.taxId,hotelCategory:f.hotelCategory,owner:f.owner,preferred:!!f.preferred,lastVerified:f.lastVerified,nextReview:f.nextReview,notes:f.notes});
  const d=dupSuppliers(s);if(d.length)toast('Note: similar supplier exists — '+d.map(x=>x.name).join(', '),'warn');audit('supplier',s.id,'update',before,s);save();render();});}

/* contacts */
function supContacts(s){const cs=S.contacts.filter(c=>c.supplierId===s.id).sort((a,b)=>(b.active-a.active)||(b.primary-a.primary)||a.dept.localeCompare(b.dept));
  return `${can.edit()?`<button class="btn pri" onclick="editContact('${s.id}')">+ Add contact</button>`:''}<div class="cards">${cs.map(c=>`<div class="card ${c.active?'':'off'}"><div class="ch"><b>${h(c.name)}</b><span>${c.primary?'<span class="st">Primary · '+h(c.dept)+'</span>':'<span class="muted">'+h(c.dept)+'</span>'} ${c.active?'':'<span class="st st-Archived">Inactive</span>'}${c.emergency?' <span class="st st-warn">24h emergency</span>':''}</span></div>
  <div class="muted">${h(c.position)}${c.hours?' · '+h(c.hours):''}${c.preferred?' · prefers '+h(c.preferred):''}</div>
  <div class="links">${c.phone?`<a href="tel:${h(c.phone)}">📞 ${h(c.phone)}</a><button class="lnk" onclick="copyTxt('${h(c.phone)}')">copy</button>`:''}${c.whatsapp?`<a href="https://wa.me/${h(c.whatsapp.replace(/\D/g,''))}" target="_blank" rel="noopener">💬 WhatsApp ${h(c.whatsapp)}</a>`:''}${c.email?`<a href="mailto:${h(c.email)}">✉ ${h(c.email)}</a><button class="lnk" onclick="copyTxt('${h(c.email)}')">copy</button>`:''}${c.line?`<span>LINE: ${h(c.line)}</span>`:''}</div>
  <div class="muted small">Verified: ${fd(c.verifiedAt)}${daysBetween(c.verifiedAt||'2000-01-01',today())>180?' <span class="warn-t">⚠ stale</span>':''}</div>
  ${can.edit()?`<div class="actions"><button class="btn sm" onclick="editContact('${s.id}','${c.id}')">Edit</button><button class="btn sm" onclick="verifyContact('${c.id}')">Mark verified today</button>${c.active?`<button class="btn sm" onclick="toggleContact('${c.id}')">Deactivate</button>`:`<button class="btn sm" onclick="toggleContact('${c.id}')">Re-activate</button>`}</div>`:''}</div>`).join('')||'<p class="muted">No contacts.</p>'}</div><p class="muted small">Opening a link only launches your phone/mail/WhatsApp app — nothing is sent automatically.</p>`;}
function copyTxt(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Copied'));}
function verifyContact(id){const c=find(S.contacts,id);c.verifiedAt=today();audit('contact',id,'verify');save();render();}
function toggleContact(id){const c=find(S.contacts,id);audit('contact',id,c.active?'deactivate':'activate');c.active=!c.active;if(!c.active)c.primary=false;save();render();}
function editContact(sid,cid){const c=cid?find(S.contacts,cid):{name:'',position:'',dept:'Reservations',email:'',phone:'',whatsapp:'',line:'',preferred:'WhatsApp',hours:'',emergency:false,active:true,primary:false,verifiedAt:today()};
  openModal(cid?'Edit contact':'Add contact',`<label>Full name *<input name="name" value="${h(c.name)}"></label><label>Position<input name="position" value="${h(c.position)}"></label><label>Department<select name="dept">${DEPTS.map(d=>`<option ${c.dept===d?'selected':''}>${d}</option>`).join('')}</select></label><label>Email<input name="email" type="email" value="${h(c.email)}"></label><label>Phone<input name="phone" value="${h(c.phone)}"></label><label>WhatsApp<input name="whatsapp" value="${h(c.whatsapp)}"></label><label>LINE ID<input name="line" value="${h(c.line)}"></label><label>Preferred channel<select name="preferred">${['WhatsApp','Phone','Email','LINE'].map(x=>`<option ${c.preferred===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Business hours<input name="hours" value="${h(c.hours)}" placeholder="Mon–Fri 09:00–18:00"></label><label class="inline"><input type="checkbox" name="emergency" ${c.emergency?'checked':''}> Available for emergencies (24h)</label><label class="inline"><input type="checkbox" name="primary" ${c.primary?'checked':''}> Primary contact for this department</label><label>Verified on<input type="date" name="verifiedAt" value="${c.verifiedAt||''}"></label>`,f=>{
  if(!f.name.trim())return 'Name required';if(!f.email&&!f.phone&&!f.whatsapp&&!f.line)return 'At least one contact channel';const before={...c};Object.assign(c,{name:f.name.trim(),position:f.position,dept:f.dept,email:f.email.trim(),phone:f.phone.trim(),whatsapp:f.whatsapp.trim(),line:f.line.trim(),preferred:f.preferred,hours:f.hours,emergency:!!f.emergency,primary:!!f.primary,verifiedAt:f.verifiedAt});
  if(c.primary)S.contacts.filter(x=>x.supplierId===sid&&x.dept===c.dept&&x.id!==c.id).forEach(x=>x.primary=false);
  if(!cid){c.id=uid();c.supplierId=sid;S.contacts.push(c);}audit('contact',c.id,cid?'update':'create',cid?before:null,c);save();render();});}

/* ---------- products (canonical) ---------- */
const CATFIELDS={Hotel:[['propertyWing','Property / wing'],['star','Star category (as recorded)'],['checkIn','Check-in time'],['checkOut','Check-out time'],['childPolicy','Child policy'],['minStay','Minimum stay (nights)']],
 Transfer:[['route','Route / zones'],['direction','One-way / Return'],['vehicleClass','Vehicle class'],['seats','Passenger capacity'],['luggage','Luggage capacity (pieces)'],['hours','Included hours'],['tolls','Toll / parking'],['waiting','Waiting allowance'],['stop','Additional stop charge'],['overtime','Overtime / night surcharge']],
 Tour:[['basis','SIC / Private'],['elig','Adult / child / infant eligibility'],['ageHeight','Age / height boundaries'],['zones','Transfer zones'],['meal','Meal plan'],['session','Session / show time'],['days','Operating days'],['parkFees','Excluded park fees']],
 'Dinner Cruise':[['program','Program'],['pier','Pier'],['checkin','Check-in / sailing time'],['deck','Deck / seating'],['buffet','Buffet type'],['drinks','Drinks'],['transfer','Transfer option'],['special','Special-date rules']],
 Guide:[['language','Language'],['area','Area'],['duration','Half / full day'],['hours','Included hours'],['overtime','Overtime'],['overnight','Overnight allowance']],
 Restaurant:[['menu','Menu / package'],['dietary','Dietary arrangements'],['halal','Halal status (as verified)'],['minPax','Minimum pax'],['privateRoom','Private room'],['drinks','Drinks'],['duration','Service duration']],
 Boat:[['route','Route'],['class','Vessel / seat class'],['schedule','Schedule'],['capacity','Capacity'],['luggage','Luggage'],['pierTransfer','Pier transfer']],
 MICE:[['venue','Venue'],['capacity','Capacity per layout'],['rental','Hall rental'],['package','Per-person package'],['meals','Meals'],['av','AV'],['stage','Stage / LED'],['setup','Setup time'],['overtime','Overtime']]};
CATFIELDS.Attraction=CATFIELDS.Ticket=CATFIELDS.Show=CATFIELDS.Activity=CATFIELDS.Tour;CATFIELDS.Vehicle=CATFIELDS.Transfer;CATFIELDS.Meal=CATFIELDS.Restaurant;
const OPTFIELDS={Hotel:[['roomType','Room type'],['bedType','Bed type'],['occupancy','Occupancy (SGL/DBL/TWN/TRPL)'],['maxAdults','Max adults'],['maxChildren','Max children'],['extraBed','Extra bed available (Y/N)'],['mealPlan','Meal plan'],['breakfastCount','Breakfast count']],Transfer:[['vehicleClass','Vehicle class'],['seats','Seats'],['luggage','Luggage pieces']],Tour:[['option','Package option'],['basis','SIC / Private'],['seating','Seating class']]};
function optFields(cat){return OPTFIELDS[cat]||OPTFIELDS[{Attraction:'Tour',Ticket:'Tour',Show:'Tour',Activity:'Tour','Dinner Cruise':'Tour',Vehicle:'Transfer',Boat:'Transfer'}[cat]]||[['option','Option name / detail']];}
function productsView(){const q=(route.id||'').toLowerCase();const list=S.products.filter(p=>!q||(p.title+p.category+p.destination).toLowerCase().includes(q));
  return `<div class="hrow"><h1>Canonical products <span class="muted">(${S.products.length})</span></h1>${can.edit()?`<button class="btn pri" onclick="editProduct()">+ Add product</button>`:''}</div><p class="muted small">A product (hotel property, tour, route) is what is bought; it may be offered by several suppliers at different rates, so offers are compared under one product.</p>
  <input placeholder="Search products…" value="${h(route.id||'')}" oninput="route.id=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
  <div class="cards">${list.map(p=>{const ops=S.options.filter(o=>o.productId===p.id);const offs=S.offers.filter(o=>o.productId===p.id);return `<div class="card"><div class="ch"><b>${h(p.title)}</b><span class="muted">${h(p.code)}</span></div><div class="muted">${h(p.category)} · ${h(p.destination)}${p.status==='Archived'?' · Archived':''}</div><div>${h(p.description||'')}</div><div class="small">Options: ${ops.map(o=>h(o.name)).join(', ')||'<span class="warn-t">none</span>'}</div><div class="small">Offered by: ${[...new Set(offs.map(o=>supplierOf(o)?supplierOf(o).name:'?'))].map(h).join(', ')||'<span class="muted">no supplier yet</span>'}</div>${can.edit()?`<div class="actions"><button class="btn sm" onclick="editProduct('${p.id}')">Edit</button><button class="btn sm" onclick="editOption('${p.id}')">+ Option</button>${ops.map(o=>`<button class="btn sm" onclick="editOption('${p.id}','${o.id}')">✏ ${h(o.name)}</button>`).join('')}</div>`:''}</div>`;}).join('')||'<p class="muted">No products.</p>'}</div>`;}
function editProduct(pid,cb){const p=pid?find(S.products,pid):{title:'',category:'Hotel',destination:'',description:'',fields:{},status:'Active',leadTime:'',cancelRef:''};
  const body=cat=>`<label>Title *<input name="title" value="${h(p.title)}" placeholder="e.g. Golden Beach Hotel Pattaya"></label><label>Category<select name="category" onchange="document.getElementById('cf').innerHTML=catFieldsHtml(this.value,${JSON.stringify(p.fields).replace(/"/g,'&quot;')})">${CATS.map(c=>`<option ${cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Destination *<input name="destination" list="dests" value="${h(p.destination)}"><datalist id="dests">${DESTS.map(d=>`<option value="${d}">`).join('')}</datalist></label><label>Description<textarea name="description">${h(p.description)}</textarea></label><label>Booking lead time<input name="leadTime" value="${h(p.leadTime||'')}" placeholder="e.g. 48 hours"></label><div id="cf">${catFieldsHtml(cat,p.fields)}</div>`;
  openModal(pid?'Edit product':'Add canonical product',body(p.category),f=>{if(!f.title.trim()||!f.destination.trim())return 'Title and destination required';const before={...p};const fields={};(CATFIELDS[f.category]||[]).forEach(([k])=>{if(f['f_'+k]!=null&&f['f_'+k]!=='')fields[k]=f['f_'+k];});Object.assign(p,{title:f.title.trim(),category:f.category,destination:f.destination.trim(),description:f.description,leadTime:f.leadTime,fields});if(!pid){p.id=uid();p.code=code('PRD');S.products.push(p);}audit('product',p.id,pid?'update':'create',pid?before:null,p);save();if(cb)cb(p);else render();});}
function catFieldsHtml(cat,vals){const fs=CATFIELDS[cat];if(!fs)return '<p class="muted small">No category-specific fields.</p>';return `<fieldset><legend>${h(cat)} details</legend>${fs.map(([k,l])=>`<label>${l}<input name="f_${k}" value="${h((vals||{})[k]||'')}"></label>`).join('')}</fieldset>`;}
function editOption(pid,oid,cb){const p=find(S.products,pid);const o=oid?find(S.options,oid):{name:'',fields:{},inclusions:'',exclusions:'',schedule:'',status:'Active'};const fs=optFields(p.category);
  openModal((oid?'Edit':'Add')+' option — '+p.title,`<label>Option name *<input name="name" value="${h(o.name)}" placeholder="${p.category==='Hotel'?'e.g. Superior Twin · 2 single beds · BB':'e.g. Private van 10-seat, one-way'}"></label>${fs.map(([k,l])=>`<label>${l}<input name="f_${k}" value="${h(o.fields[k]||'')}"></label>`).join('')}${p.category==='Hotel'?'<p class="muted small">Record a true Triple room as its own option; do not label "Twin + extra bed" as Triple.</p>':''}<label>Inclusions<textarea name="inclusions">${h(o.inclusions)}</textarea></label><label>Exclusions<textarea name="exclusions">${h(o.exclusions)}</textarea></label><label>Operating schedule / days<input name="schedule" value="${h(o.schedule)}"></label>`,f=>{if(!f.name.trim())return 'Option name required';const before={...o};const fields={};fs.forEach(([k])=>{if(f['f_'+k])fields[k]=f['f_'+k];});Object.assign(o,{name:f.name.trim(),fields,inclusions:f.inclusions,exclusions:f.exclusions,schedule:f.schedule});if(!oid){o.id=uid();o.productId=pid;S.options.push(o);}audit('option',o.id,oid?'update':'create',oid?before:null,o);save();if(cb)cb(o);else render();});}

/* ---------- services & rates (offers) ---------- */
function supServices(s){const offers=S.offers.filter(o=>o.supplierId===s.id);
  return `${can.edit()?`<button class="btn pri" onclick="addOffer('${s.id}')">+ Add supplier offer</button> <button class="btn" onclick="editProduct(null,p=>{editOption(p.id,null,()=>addOffer('${s.id}'))})">+ New product + option, then offer</button>`:''}
  ${offers.map(o=>{const plans=S.plans.filter(p=>p.offerId===o.id);const av=latestAvail(o.id,'0000','9999');return `<div class="card offer"><div class="ch"><b>${h(offerLabel(o))}</b><span class="st">${h(o.status)}</span></div><div class="muted small">${h(find(S.products,o.productId)?.category||'')} · ${h(find(S.products,o.productId)?.destination||'')} · Cancellation ref: ${h(o.cancelRef||'supplier default')}</div>

let sq={dest:'',cat:'Hotel',productId:'',svcFrom:'',svcTo:'',bookingDate:today(),adults:2,childAges:'',rooms:1,extraBeds:0,qty:1,market:'Bangladesh',supplierId:'',bookingRef:'',toCurrency:'',filter:''};

  <label>Adults<input type="number" min="0" value="${sq.adults}" onchange="sq.adults=Number(this.value)"></label><label>Child ages (comma)<input value="${h(sq.childAges)}" onchange="sq.childAges=this.value" placeholder="e.g. 4, 9"></label><label>Rooms<input type="number" min="1" value="${sq.rooms}" onchange="sq.rooms=Number(this.value)"></label><label>Extra beds<input type="number" min="0" value="${sq.extraBeds}" onchange="sq.extraBeds=Number(this.value)"></label><label>Quantity (vehicles / items)<input type="number" min="1" value="${sq.qty}" onchange="sq.qty=Number(this.value)"></label><label>Booking ref (for group/one-time rates)<input value="${h(sq.bookingRef)}" onchange="sq.bookingRef=this.value"></label><label>Show in currency<select onchange="sq.toCurrency=this.value"><option value="">original</option><option ${sq.toCurrency==='THB'?'selected':''}>THB</option><option ${sq.toCurrency==='USD'?'selected':''}>USD</option></select></label><label>Filter<select onchange="sq.filter=this.value;render()">${['','Approved','Expiring Soon','Expired','Missing Rate','Needs Verification'].map(f=>`<option value="${f}" ${sq.filter===f?'selected':''}>${f||'all eligible + excluded'}</option>`).join('')}</select></label>
  <button class="btn pri" onclick="runSearch()">Search</button></div><div id="sres">${window._sres||''}</div>`;}
function runSearch(){if(!sq.svcFrom)return toast('Enter the service / check-in date','err');const q={svcFrom:sq.svcFrom,svcTo:sq.svcTo||sq.svcFrom,bookingDate:sq.bookingDate,adults:sq.adults,childAges:sq.childAges.split(',').map(x=>x.trim()).filter(Boolean).map(Number),rooms:sq.rooms,extraBeds:sq.extraBeds,qty:sq.qty,market:sq.market,bookingRef:sq.bookingRef,toCurrency:sq.toCurrency};
  const offers=S.offers.filter(o=>o.status!=='Archived'&&(!sq.supplierId||o.supplierId===sq.supplierId)&&(!sq.productId||o.productId===sq.productId)).filter(o=>{const p=find(S.products,o.productId);return p&&(!sq.cat||p.category===sq.cat)&&(!sq.dest||p.destination===sq.dest);});
  let rows=[];offers.forEach(o=>{const rs=priceOffer(o,q);if(!rs.length)rows.push({offer:o,missing:true});rs.forEach(r=>rows.push({offer:o,r}));});
  const t=today(),soon=addDays(t,30);rows=rows.filter(x=>{if(!sq.filter)return true;if(sq.filter==='Missing Rate')return x.missing||(x.r&&x.r.reasons.some(m=>/Rate Required|price missing/.test(m)));if(x.missing)return false;const v=x.r.version;if(sq.filter==='Approved')return v.state==='Approved'&&x.r.eligible;if(sq.filter==='Expiring Soon')return v.state==='Approved'&&v.svcTo>=t&&v.svcTo<=soon;if(sq.filter==='Expired')return validity(v)==='Expired';if(sq.filter==='Needs Verification')return x.r.needsVerification;return true;});
  rows.sort((a,b)=>{const ea=a.r&&a.r.eligible&&a.r.total!=null,eb=b.r&&b.r.eligible&&b.r.total!=null;if(ea!==eb)return ea?-1:1;if(ea&&eb&&a.r.currency===b.r.currency)return a.r.total-b.r.total;return 0;});
  const nights=daysBetween(q.svcFrom,q.svcTo);
  window._sres=`<p class="muted small">${rows.length} result(s). Ranking by price uses only eligible, approved, comparable rates with complete charges. Differences in room type, meal plan, transfer scope or cancellation terms are listed — compare like with like.</p><div class="cards">${rows.map(x=>{const o=x.offer,sp=supplierOf(o),p=find(S.products,o.productId),op=find(S.options,o.optionId);if(x.missing)return `<div class="card off"><div class="ch"><b>${h(p.title)} · ${h(op?op.name:'')}</b><span class="st st-warn">Missing Rate</span></div><div class="muted">${h(sp.name)} — no rate plan recorded</div></div>`;const r=x.r,v=r.version,pl=r.plan;
   return `<div class="card ${r.eligible?'':'off'}"><div class="ch"><b>${h(p.title)} · ${h(op?op.name:'')}</b><span>${r.eligible?(r.total!=null?'<span class="st st-Approved">Eligible</span>':'<span class="st st-warn">Needs Verification</span>'):'<span class="st st-Rejected">Excluded</span>'}</span></div>
   <div class="muted small">${h(sp.name)} (${h(sp.type)}) · ${h(pl.name)} · ${h(pl.rateType)} · v${v.version} ${h(v.state)} · validity ${validity(v)} · ${h(pl.unit)}</div>
   ${can.cost()?`<div class="price">${r.total!=null?`<b>${money(r.total,r.currency)}</b> effective total${r.nights?` for ${r.nights} night${r.nights>1?'s':''}`:''}${r.converted?` <span class="muted">≈ ${money(r.converted.amount,r.converted.currency)} (estimate @ ${r.converted.rate} on ${r.converted.date})</span>`:''}`:'<b class="warn-t">No verified total</b>'}<div class="small">Base ${money(r.base,r.currency)}${r.parts?' ('+h(r.parts.join(', '))+')':''}${r.charges.map(c=>` + ${h(c.name)} ${c.amount==null?'<span class="warn-t">?</span>':money(c.amount,r.currency)}`).join('')}</div>${r.split?`<div class="small muted">Nightly split: ${r.split.map(s=>`${s.day} ${money(s.amount,r.currency)}`).join(' · ')}</div>`:''}</div>`:'<div class="muted small">Cost hidden for your role — ask Reservations for a selling price.</div>'}

  else if(r==='snapshots'){body=S.snapshots.length?`<table class="tbl"><thead><tr><th>When</th><th>Supplier / product</th><th>Dates</th>${can.cost()?'<th>Cost</th>':''}<th>Sell</th><th>Method</th></tr></thead><tbody>${S.snapshots.slice().reverse().map(s=>`<tr><td>${fdt(s.at)}<br><small>${h(s.by)}</small></td><td>${h(s.supplier)}<br><small>${h(s.product)}</small></td><td>${s.svcFrom} → ${s.svcTo}</td>${can.cost()?`<td>${money(s.cost,s.currency)}</td>`:''}<td>${money(s.sell,s.currency)}</td><td>${h(s.method)}</td></tr>`).join('')}</tbody></table><p class="muted small">Snapshots are immutable: supplier rate changes never alter them. A recost would create a new snapshot showing old vs new.</p>`:'<p class="muted">No quote snapshots.</p>';}

function restoreBackup(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.suppliers)throw 0;if(!confirm('Replace all local data with this backup?'))return;S=Object.assign(blank(),d);S.session=S.session||null;save();render();toast('Backup restored');}catch(e){toast('Not a valid backup','err');}};fr.readAsText(file);}
function pick(o,keys){for(const k of keys){if(o[k]!=null&&o[k]!=='')return o[k];}return '';}

  let added=0,skipped=0,prods=0;const log=[];arr.forEach(x=>{const name=pick(x,['name','supplierName','company']);if(!name){skipped++;return;}let cats=x.categories||x.serviceCategories||(x.category?[x.category]:[]);if(typeof cats==='string')cats=[cats];cats=cats.map(c=>CAT_ALIAS[c]||c);cats=[...new Set(cats.map(c=>CATS.includes(c)?c:c))];if(!cats.length)cats=['Other'];
   const dest=pick(x,['destination','city','location']);const existing=S.suppliers.find(s=>normName(s.name)===normName(name));if(existing){skipped++;log.push('Skipped duplicate: '+name);return;}
   const sup={id:uid(),code:code('SUP'),name,legalName:'',type:'Direct Provider',categories:cats,country:'Thailand',city:dest,destinations:dest?[dest]:[],address:pick(x,['address','addr']),mapsUrl:'',website:'',taxId:pick(x,['taxId','tax_id']),owner:S.session.user,preferred:false,status:(pick(x,['status'])||'Active').replace(/^Inactive$/,'On Hold'),lastVerified:'',nextReview:addDays(today(),90),notes:pick(x,['notes','note']),hotelCategory:pick(x,['hotelCategory','hotelCat','star','category_star']),legacy:{sourceId:x.id||x.uid||'',sourceSystem:'Operations Hub',importedAt:nowIso()},createdAt:nowIso()};
   S.suppliers.push(sup);added++;
   const emails=(x.emails||[]).map(e=>typeof e==='string'?{email:e}:e);const cname=pick(x,['contactPerson','contact','contactName']);const phone=pick(x,['mobile','phone','tel']),wa=pick(x,['whatsapp','whatsApp']),line=pick(x,['lineId','line']);
   if(cname||phone||wa||emails.length)S.contacts.push({id:uid(),supplierId:sup.id,name:cname||'Main contact',position:'',dept:'Reservations',email:emails[0]?emails[0].email||emails[0].address||'':'',phone,whatsapp:wa,line,preferred:wa?'WhatsApp':phone?'Phone':'Email',hours:'',emergency:false,active:true,verifiedAt:'',primary:true});
   emails.slice(1).forEach(e=>S.contacts.push({id:uid(),supplierId:sup.id,name:(e.label||e.type||'CC')+' email',position:'',dept:'Reservations',email:e.email||e.address||'',phone:'',whatsapp:'',line:'',preferred:'Email',hours:'',emergency:false,active:true,verifiedAt:'',primary:false}));
   S.policies.push({id:uid(),supplierId:sup.id,payment:{mode:pick(x,['payTerms','paymentTerms'])||'Prepayment',creditDays:Number(pick(x,['creditDays']))||null,creditEvent:'Invoice date',depositPct:(x.depositRequired===true||x.depositRequired==='Yes')&&x.depositPct?Number(x.depositPct):null,depositAmt:null,dueBasis:'',balanceDeadline:'',currencies:[pick(x,['currency','paymentCurrency'])||'THB']},cancellation:[],noShow:'',amendment:'',refund:'',unusedCredit:''});
   if(pick(x,['bankName','bank'])||pick(x,['accountNumber','accountNo']))S.bank.push({id:uid(),supplierId:sup.id,holder:pick(x,['accountName','accountHolder']),bank:pick(x,['bankName','bank']),account:String(pick(x,['accountNumber','accountNo'])),branch:pick(x,['branch']),swift:pick(x,['swift','swiftCode']),currency:pick(x,['currency'])||'THB',verified:false,history:[]});
   (x.contractRates||x.contracts||x.files||[]).forEach(f=>S.documents.push({id:uid(),code:code('DOC'),supplierId:sup.id,title:f.name||f.title||f.fileName||'Contract rate',type:'Rate sheet',ref:'',linked:[],receivedDate:(f.uploadedAt||f.date||'').slice(0,10),validFrom:'',validTo:'',version:1,supersedes:null,status:'Current',fileName:f.name||f.fileName||'',fileSize:f.size||0,dataUrl:(f.dataUrl&&f.dataUrl.length<700000)?f.dataUrl:'',uploadedBy:'import',uploadedAt:nowIso()}));
   const rooms=x.roomCategories||x.roomCats||[];if(cats.includes('Hotel')&&rooms.length){const p={id:uid(),code:code('PRD'),title:name,category:'Hotel',destination:dest,description:'Imported from Operations Hub hotel inventory',fields:{star:sup.hotelCategory},status:'Active'};S.products.push(p);prods++;rooms.forEach(rc=>{const rn=typeof rc==='string'?rc:(rc.name||rc.category||'Room');const op={id:uid(),productId:p.id,name:rn,fields:{roomType:rn},inclusions:'',exclusions:'',schedule:'',status:'Active'};S.options.push(op);S.offers.push({id:uid(),supplierId:sup.id,productId:p.id,optionId:op.id,status:'Active',leadTime:'',cancelRef:'',inclusions:'',exclusions:''});});}
   audit('supplier',sup.id,'import',null,{from:'Operations Hub'});});
  save();document.getElementById('impres').innerHTML=`<div class="box">Imported ${added} supplier(s), ${prods} hotel product(s) with room options; skipped ${skipped}. ${log.slice(0,10).map(h).join('<br>')}</div>`;toast('Import complete');};fr.readAsText(file);}

/* ---------- modal ---------- */
function openModal(title,body,onSave){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox"><div class="mh"><b>${title}</b><button class="x" onclick="closeModal()">✕</button></div><form class="mb" onsubmit="return false">${body}</form><div class="mf">${onSave?`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="msave">Save</button>`:`<button class="btn" onclick="closeModal()">Close</button>`}</div></div>`;document.body.appendChild(m);modalStack.push(m);const form=m.querySelector('form');form.addEventListener('input',()=>dirty=true);
  if(onSave){m.querySelector('#msave').onclick=async()=>{const f={};new FormData(form).forEach((v,k)=>f[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>f[c.name]=c.checked);form.querySelectorAll('input[type=file]').forEach(c=>f[c.name]=c.files[0]);dirty=false;const err=await onSave(f);if(typeof err==='string'){dirty=true;toast(err,'err');return;}dirty=false;closeModal();};}
  const first=form.querySelector('input,select,textarea');if(first)first.focus();}
function closeModal(){const m=modalStack.pop();if(m)m.remove();dirty=false;if(!modalStack.length)render();}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)closeModal();});
load();render();
